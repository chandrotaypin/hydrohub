<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hydro Hub – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body>

<div class="page">

  <!-- Deep ocean gradient background -->
  <div class="bg-deep"></div>

  <!-- Floating bubbles -->
  <div class="bubbles">
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
  </div>

  <!-- Header / Branding -->
  <header class="header">
    <div class="logo-ring">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M16 4C16 4 6 14.5 6 20.5C6 26 10.5 29 16 29C21.5 29 26 26 26 20.5C26 14.5 16 4 16 4Z"
              fill="rgba(255,255,255,0.9)" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M11 22C11.5 24.5 13.5 26 16 26"
              stroke="rgba(33,72,192,0.6)" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <h1 class="brand">Hydro Hub</h1>
    <p class="brand-sub">Laundry &amp; Water Station</p>
  </header>

  <!-- Login Card -->
  <div class="card-wrap">
    <div class="drop drop-1"></div>
    <div class="drop drop-2"></div>

    <p class="welcome">Welcome back!</p>

    <!-- Error message element -->
    <p id="login-error" class="login-error" hidden></p>

    <form class="form" onsubmit="handleLogin(event)">

      <!-- Username -->
      <div class="field">
        <label for="username">User name</label>
        <div class="input-wrap">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            autocomplete="username"
            required
          />
        </div>
      </div>

      <!-- Password -->
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            class="toggle-pwd"
            onclick="togglePwd()"
            title="Show/hide password"
            aria-label="Toggle password visibility"
          >
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-login">Log in</button>

    </form>
  </div>

</div>

<!-- auth.js MUST come first so getToken / isTokenValid / saveToken are defined -->
<script src="../js/auth.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
