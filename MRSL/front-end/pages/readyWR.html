<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ready for Pickup — Water Refilling | Hydro Hub</title>
  <link rel="stylesheet" href="../css/readyWR.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>

  <!-- =============================================
       MOBILE FRAME
  ============================================= -->
  <div class="mobile-frame">

    <div class="mob-header">
      <button class="back-btn" aria-label="Go back" onclick="location.href='dashboard.html?tab=water'">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M15 19l-7-7 7-7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1 class="page-title">Ready for Pickup</h1>
    </div>

    <div class="orders-list" id="mob-list-ready">
      <p class="empty-state">Loading…</p>
    </div>

  </div>
  <!-- end mobile-frame -->


  <!-- =============================================
       DESKTOP LAYOUT
  ============================================= -->
  <div class="desktop-layout">

    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-drop"></div>
        <span>HydroHub</span>
      </div>
      <div class="sidebar-user">
        <div class="avatar" data-avatar></div>
        <div>
          <p class="s-welcome">Welcome back</p>
          <p class="s-name" data-username></p>
        </div>
      </div>
      <nav class="sidebar-nav">
        <p class="nav-group-label">Services</p>
        <button class="nav-item" onclick="location.href='dashboard.html?tab=laundry'">
          <svg viewBox="0 0 24 24" fill="none" width="20" height="20">
            <rect x="3" y="4" width="18" height="17" rx="3" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="12" cy="13" r="4" stroke="currentColor" stroke-width="1.8"/>
            <rect x="5" y="7" width="3" height="1.5" rx=".75" fill="currentColor"/>
          </svg>
          Laundry
        </button>
        <button class="nav-item active" onclick="location.href='dashboard.html?tab=water'">
          <svg viewBox="0 0 24 24" fill="none" width="20" height="20">
            <path d="M9 3h6v3.5C17.5 8 20 11 20 14a8 8 0 0 1-16 0c0-3 2.5-6 5-7.5V3z" stroke="currentColor" stroke-width="1.8" fill="none"/>
          </svg>
          Water Refill
        </button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-item settings-btn" data-logout>
          <svg viewBox="0 0 24 24" fill="none" width="20" height="20">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <polyline points="16 17 21 12 16 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          Log Out
        </button>
      </div>
    </aside>

    <main class="desktop-main">
      <header class="desktop-header">
        <div>
          <p class="dh-label">WATER REFILLING</p>
          <h2 class="dh-title">Ready for Pickup</h2>
        </div>
        <div class="header-actions">
          <div class="order-count-chip" id="chip-ready">
            <span class="chip-dot teal"></span>
            — Ready
          </div>
        </div>
      </header>

      <div class="desk-orders-container">
        <table class="orders-table">
          <thead>
            <tr>
              <th>Order #</th>
              <th>Customer</th>
              <th>Service</th>
              <th>Qty</th>
              <th>Time In</th>
              <th>Price</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="desk-tbody-ready">
            <tr><td colspan="7" class="empty-state">Loading…</td></tr>
          </tbody>
        </table>
      </div>

    </main>
  </div>
  <!-- end desktop-layout -->


  <!-- =============================================
       CONFIRM MODAL
  ============================================= -->
  <div class="modal-overlay" id="confirmModal" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      <p class="modal-heading">
        Mark order <span id="modal-order-num">#—</span><br>as <span>Claimed</span>?
      </p>
      <div class="modal-actions">
        <button class="modal-btn undo" id="modalUndo">
          <svg viewBox="0 0 24 24" fill="none" width="18" height="18">
            <path d="M3 10h10a7 7 0 1 1 0 14H3" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7 6L3 10l4 4" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Cancel
        </button>
        <button class="modal-btn confirm" id="modalConfirm">
          <svg viewBox="0 0 24 24" fill="none" width="18" height="18">
            <path d="M5 13l4 4L19 7" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Confirm
        </button>
      </div>
    </div>
  </div>

  <!-- auth.js MUST come first -->
  <script src="../js/auth.js"></script>
  <script src="../js/readyWR.js" defer></script>

</body>
</html>
